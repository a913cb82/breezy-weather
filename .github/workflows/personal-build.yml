# Personal-use build: assembles the freenet debug APK on GitHub-hosted
# runners (free for public repos) and keeps it as a downloadable artifact.
# No -Pbreezy flag (personal use only, must not be redistributed), no API
# keys needed for the freenet flavor.
#
# Run manually: Actions tab -> "Personal freenet debug build" -> Run workflow,
# or: gh workflow run personal-build --ref <branch>

name: Personal freenet debug build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Ensure Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Assemble freenet debug
        run: ./gradlew assembleFreenetDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freenet-debug-apk
          path: app/build/outputs/apk/freenet/debug/*.apk
          retention-days: 14
